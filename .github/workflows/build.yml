name: Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build mod
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect release artifacts
        run: |
          mkdir -p dist
          find build/libs -maxdepth 1 -name 'mixintrace-*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mixintrace-jar
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: mixintrace-jar
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "MixinTrace ${GITHUB_REF_NAME#v}" \
            --generate-notes
